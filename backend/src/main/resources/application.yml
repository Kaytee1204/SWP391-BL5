server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: springboot-base-api

  # Microsoft SQL Server Database Configuration
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SWP391;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: 123

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB

  # JPA Configuration: ddl-auto: none (CHỈ KẾT NỐI, KHÔNG TỰ ĐỘNG TẠO/SỬA BẢNG)
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Application JWT Configuration
app:
  storage:
    listening-dir: uploads/listening
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Logging Configuration
logging:
  level:
    com.example.base: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
