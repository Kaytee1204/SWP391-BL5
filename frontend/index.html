<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLMS — The Intelligent Platform Your Japanese Learning Deserves</title>
  
  <!-- Google Fonts: Plus Jakarta Sans, Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      /* Theme: Jasper.ai Aesthetic Palette */
      --primary-purple: #7C3AED;
      --primary-purple-hover: #6D28D9;
      --primary-purple-glow: rgba(124, 58, 237, 0.35);
      --primary-purple-light: #f5f3ff;
      --primary-purple-border: #ddd6fe;

      --primary-orange: #f97316;
      --primary-orange-hover: #ea580c;
      --primary-orange-light: #fff7ed;
      --primary-orange-border: #fed7aa;

      --bg-body: #fbf9f5;
      --bg-card: #ffffff;
      --border-color: #f2ede4;

      --text-heading: #0f172a;
      --text-body: #475569;
      --text-muted: #94a3b8;
      
      --glass-bg: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 20px 45px -15px rgba(124, 58, 237, 0.16), 0 0 1px 1px rgba(255, 255, 255, 0.95);

      --radius-full: 9999px;
      --radius-2xl: 24px;
      --radius-xl: 16px;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;

      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', 'Noto Sans JP', sans-serif;
      color: var(--text-heading);
      background-color: var(--bg-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .landing-bg {
      background: linear-gradient(180deg, #fff7ed 0%, #fff1f2 28%, #f5f3ff 65%, #ede9fe 100%);
      min-height: 100vh;
      position: relative;
    }

    .bg-canvas-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 900px;
      pointer-events: none;
      background: radial-gradient(circle at 50% 25%, rgba(124, 58, 237, 0.14) 0%, rgba(244, 114, 182, 0.09) 45%, rgba(255, 255, 255, 0) 70%);
      z-index: 0;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    .navbar-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7C3AED 0%, #ec4899 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.35);
      transition: var(--transition);
    }
    .brand-group:hover .brand-icon {
      transform: rotate(-8deg) scale(1.06);
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--text-heading);
    }

    .brand-title span {
      background: linear-gradient(135deg, #7C3AED 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.25rem;
      list-style: none;
    }

    .nav-link {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-body);
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .nav-link:hover { color: var(--primary-purple); }

    .nav-link.badge-link::after {
      content: 'AI 2.0';
      font-size: 0.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7C3AED, #ec4899);
      color: white;
      padding: 1px 6px;
      border-radius: 9999px;
      margin-left: 6px;
      position: relative;
      top: -1px;
    }

    .nav-cta-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      position: relative;
    }

    .btn-login {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-heading);
      background: transparent;
      border: 1px solid transparent;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-xl);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-login:hover {
      background: rgba(124, 58, 237, 0.08);
      color: var(--primary-purple);
    }

    .btn-primary-purple {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.75rem 1.65rem;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.45);
      transition: var(--transition);
      text-decoration: none;
    }
    .btn-primary-purple:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 32px -5px rgba(124, 58, 237, 0.6);
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
    }

    .btn-secondary-glass {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-heading);
      border: 1px solid rgba(226, 232, 240, 0.9);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      transition: var(--transition);
    }
    .btn-secondary-glass:hover {
      background: rgba(255, 255, 255, 0.98);
      border-color: var(--primary-purple-border);
      color: var(--primary-purple);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.14);
    }

    /* =======================================================================
       FACEBOOK-STYLE PROFILE BUTTON & DROPDOWN MENU
       ======================================================================= */
    .fb-profile-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 4px 8px 4px 4px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      position: relative;
    }
    .fb-profile-btn:hover, .fb-profile-btn.active {
      background: #f8fafc;
      border-color: #cbd5e1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }
    .fb-avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }
    .fb-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff7ed;
    }
    .fb-avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #334155;
      color: white;
      font-size: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid white;
    }

    .fb-dropdown-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 340px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.18), 0 0 1px 1px rgba(226, 232, 240, 0.95);
      border: 1px solid #f1f5f9;
      padding: 0.85rem;
      z-index: 100;
      animation: fbDropdownAnim 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fbDropdownAnim {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .fb-user-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.85rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
      margin-bottom: 0.5rem;
    }
    .fb-user-card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .fb-user-card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff7ed;
      border: 1.5px solid #fed7aa;
    }
    .fb-view-profile-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem;
      border-radius: 10px;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .fb-view-profile-btn:hover {
      background: #e2e8f0;
      color: var(--primary-purple);
    }

    .fb-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      color: var(--text-heading);
    }
    .fb-menu-item:hover {
      background-color: #f8fafc;
    }
    .fb-menu-item-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .fb-menu-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      color: #334155;
    }
    .fb-menu-item:hover .fb-menu-icon {
      background: #e2e8f0;
    }
    .fb-menu-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #1e293b;
    }
    .fb-menu-arrow {
      color: #94a3b8;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .fb-divider {
      height: 1px;
      background: #f1f5f9;
      margin: 0.4rem 0.25rem;
    }

    .fb-menu-logout {
      color: #e11d48;
    }
    .fb-menu-logout .fb-menu-icon {
      background: #ffe4e6;
      color: #e11d48;
    }
    .fb-menu-logout:hover {
      background: #fff1f2;
    }
    .fb-menu-logout:hover .fb-menu-icon {
      background: #fecdd3;
    }

    .hero-section {
      position: relative;
      padding: 4.5rem 1.5rem 2rem;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
      z-index: 10;
    }

    .announcement-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.25rem;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(196, 181, 253, 0.7);
      backdrop-filter: blur(10px);
      font-size: 0.88rem;
      font-weight: 700;
      color: #6D28D9;
      box-shadow: 0 6px 22px -2px rgba(124, 58, 237, 0.14);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 1.75rem;
    }
    .announcement-badge:hover {
      transform: translateY(-2px);
      background: #ffffff;
      border-color: #7C3AED;
      box-shadow: 0 10px 28px -4px rgba(124, 58, 237, 0.28);
    }

    .badge-sparkle { animation: pulse 2s infinite ease-in-out; }

    .hero-heading {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -0.04em;
      color: #0f172a;
      max-width: 940px;
      margin: 0 auto 1.5rem;
    }

    .hero-heading-gradient {
      background: linear-gradient(135deg, #7C3AED 0%, #ec4899 45%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .hero-subheading {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.65;
      color: #475569;
      max-width: 720px;
      margin: 0 auto 2.75rem;
    }

    .hero-cta-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
      flex-wrap: wrap;
      margin-bottom: 2.75rem;
    }

    .hero-trust-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-size: 0.88rem;
      color: var(--text-body);
      font-weight: 600;
      flex-wrap: wrap;
      margin-bottom: 3.75rem;
    }

    .trust-avatars { display: flex; align-items: center; }
    .trust-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid white;
      margin-left: -8px;
      background: #fdf4ff;
    }
    .trust-avatar:first-child { margin-left: 0; }

    .isometric-stage {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: 530px;
      margin: 0 auto;
      perspective: 1300px;
      perspective-origin: 50% 30%;
    }

    .isometric-plane {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(50deg) rotateZ(-14deg);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .isometric-stage:hover .isometric-plane {
      transform: rotateX(46deg) rotateZ(-10deg) translateY(-10px);
    }

    .isometric-grid-floor {
      position: absolute;
      inset: -40px;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(124, 58, 237, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(124, 58, 237, 0.12) 1px, transparent 1px);
      border-radius: 36px;
      box-shadow: 
        inset 0 0 80px rgba(124, 58, 237, 0.15),
        0 40px 80px -20px rgba(124, 58, 237, 0.25);
      border: 2px solid rgba(196, 181, 253, 0.4);
      background-color: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
    }

    .iso-card {
      position: absolute;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--glass-shadow);
      padding: 1.25rem 1.35rem;
      transform-style: preserve-3d;
      transition: var(--transition);
      cursor: pointer;
      text-align: left;
    }

    .iso-card:hover {
      transform: translateZ(40px) scale(1.05) !important;
      border-color: rgba(124, 58, 237, 0.6);
      box-shadow: 0 30px 60px -15px rgba(124, 58, 237, 0.35), 0 0 20px rgba(124, 58, 237, 0.2);
    }

    .iso-card-ai {
      top: 10%;
      left: 26%;
      width: 330px;
      transform: translateZ(35px);
      animation: floatSlow 5s ease-in-out infinite alternate;
    }

    .iso-card-kanji {
      top: 2%;
      left: 63%;
      width: 220px;
      transform: translateZ(45px);
      animation: floatMedium 4.2s ease-in-out infinite alternate 0.5s;
    }

    .iso-card-listening {
      top: 48%;
      left: 12%;
      width: 280px;
      transform: translateZ(25px);
      animation: floatFast 3.8s ease-in-out infinite alternate 1s;
    }

    .iso-card-score {
      top: 44%;
      left: 45%;
      width: 290px;
      transform: translateZ(50px);
      animation: floatSlow 4.8s ease-in-out infinite alternate 1.5s;
    }

    .iso-card-flashcard {
      top: 46%;
      left: 76%;
      width: 210px;
      transform: translateZ(30px);
      animation: floatMedium 4s ease-in-out infinite alternate 0.8s;
    }

    @keyframes floatSlow {
      0% { transform: translateZ(25px) translateY(0px); }
      100% { transform: translateZ(40px) translateY(-14px); }
    }
    @keyframes floatMedium {
      0% { transform: translateZ(35px) translateY(0px); }
      100% { transform: translateZ(50px) translateY(-18px); }
    }
    @keyframes floatFast {
      0% { transform: translateZ(20px) translateY(0px); }
      100% { transform: translateZ(35px) translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      background: #ede9fe;
      color: #6d28d9;
      margin-bottom: 0.65rem;
    }

    .audio-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      margin-top: 0.5rem;
    }
    .audio-bar {
      width: 4px;
      background: #7C3AED;
      border-radius: 2px;
      animation: wave 1.2s infinite ease-in-out;
    }
    .audio-bar:nth-child(2) { height: 16px; animation-delay: 0.2s; }
    .audio-bar:nth-child(3) { height: 22px; animation-delay: 0.4s; }
    .audio-bar:nth-child(4) { height: 12px; animation-delay: 0.1s; }
    .audio-bar:nth-child(5) { height: 18px; animation-delay: 0.3s; }
    .audio-bar:nth-child(6) { height: 8px;  animation-delay: 0.5s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1.3); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      animation: fadeIn 0.15s ease-out;
    }

    .modal-card {
      background: #ffffff;
      border-radius: var(--radius-2xl);
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.25);
      border: 1px solid rgba(226, 232, 240, 0.9);
      padding: 2.25rem;
      animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .dashboard-layout { display: flex; min-height: 100vh; background-color: var(--bg-body); }
    .sidebar {
      width: 275px;
      background-color: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand-box { display: flex; align-items: center; gap: 0.75rem; padding-left: 0.5rem; margin-bottom: 2.25rem; }
    .brand-logo-dash {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
    }
    .sidebar-menu { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1rem; border-radius: var(--radius-md);
      font-size: 0.9rem; font-weight: 600; color: var(--text-body);
      cursor: pointer; transition: var(--transition);
    }
    .nav-item:hover { background-color: var(--primary-orange-light); color: var(--primary-orange); }
    .nav-item.active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white; box-shadow: 0 6px 16px rgba(249, 115, 22, 0.28);
    }
    .nav-item-left { display: flex; align-items: center; gap: 0.85rem; }
    .sidebar-promo-card {
      background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%);
      border-radius: var(--radius-lg); padding: 1.15rem; margin-bottom: 1.25rem;
      border: 1px solid #fdba74; text-align: center;
    }
    .sidebar-user-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.75rem; background: var(--bg-body);
      border-radius: var(--radius-md); border: 1px solid var(--border-color);
      cursor: pointer; transition: var(--transition);
    }
    .sidebar-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid white; object-fit: cover; }
    .main-viewport { flex: 1; padding: 2.25rem 2.5rem; overflow-y: auto; max-width: 1360px; }
    .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .greeting-title { font-size: 1.5rem; font-weight: 800; }
    .content-card {
      background: var(--bg-card); border-radius: var(--radius-xl);

    .card-actions-group { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

    .status-badge { padding: 0.35rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 700; cursor: pointer; border: none; }

    .status-badge.inactive { background-color: rgba(239, 68, 68, 0.1); color: #dc2626; }
    .role-badge { padding: 0.25rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; }
    .role-manager { background: #ede9fe; color: #6d28d9; }
    .role-lecturer { background: #fef3c7; color: #b45309; }
    .role-student { background: #ffedd5; color: #c2410c; }
    .role-author { background: #fce7f3; color: #be185d; }
    
    .btn-action-edit {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.82rem; font-weight: 700;

    }
    .btn-action-edit:hover { background: #dbeafe; color: #1d4ed8; transform: translateY(-1px); }

    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-top: 0.5rem; }
    .avatar-option { width: 52px; height: 52px; border-radius: 50%; padding: 2px; border: 3px solid transparent; cursor: pointer; text-align: center; margin: 0 auto; transition: var(--transition); }
    .avatar-option img { width: 100%; height: 100%; border-radius: 50%; }
    .avatar-option.selected { border-color: var(--primary-orange); transform: scale(1.08); background: var(--primary-orange-light); }
    
    .form-input, .form-select {
      width: 100%; padding: 0.72rem 0.9rem; border-radius: var(--radius-md);
      border: 1px solid #e2e8f0; margin-top: 0.3rem; outline: none; font-family: inherit; font-size: 0.9rem;
    }
    .form-input:focus, .form-select:focus { border-color: var(--primary-purple); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }

    .pagination-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color);
      font-size: 0.85rem; color: var(--text-body);
    }
    .page-btn {
      padding: 0.4rem 0.9rem; border-radius: var(--radius-md);
      background: white; border: 1px solid var(--border-color); font-weight: 700;
      cursor: pointer; transition: var(--transition);
    }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-btn:not(:disabled):hover { border-color: var(--primary-orange); color: var(--primary-orange); }

    @media (max-width: 868px) {
      .hero-heading { font-size: 2.4rem; }
      .nav-links { display: none; }
      .isometric-stage { height: 420px; }
      .isometric-plane { transform: rotateX(40deg) rotateZ(0deg) scale(0.8); }
    }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // SMART API_BASE: Points to port 8080 when running on Live Server :5500 or any custom port
    const API_BASE = (function() {
      if (window.location.port === '8080') {
        return `${window.location.origin}/api/v1`;
      }
      const host = window.location.hostname === '127.0.0.1' ? '127.0.0.1' : 'localhost';
      return `http://${host}:8080/api/v1`;
    })();

    const AVATAR_PRESETS = [
      { id: 'sensei', label: 'Sensei', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Sensei' },
      { id: 'kenji', label: 'Kenji', url: 'https://api.dicebear.com/7.x/adventurer/svg?seed=Kenji' },
      { id: 'sakura', label: 'Sakura', url: 'https://api.dicebear.com/7.x/adventurer/svg?seed=Sakura' },
      { id: 'samurai', label: 'Samurai', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Samurai' },
      { id: 'ninja', label: 'Ninja', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Ninja' },
      { id: 'taro', label: 'Taro', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Taro' },
      { id: 'yuki', label: 'Yuki', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Yuki' },
      { id: 'manager', label: 'Manager', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Manager' }
    ];

    async function apiRequest(endpoint, method = 'GET', body = null, token = null) {
      const headers = { 'Content-Type': 'application/json' };
      const authToken = token || localStorage.getItem('jwt_token');
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

      const config = { method, headers };
      if (body) config.body = JSON.stringify(body);

      const res = await fetch(`${API_BASE}${endpoint}`, config);
      const data = await res.json().catch(() => null);

      if (!res.ok) {
        const errorMsg = data?.message || `System Error (${res.status})`;
        const err = new Error(errorMsg);
        err.fieldErrors = data?.data || {};
        throw err;
      }
      return data;
    }

    // =========================================================================
    // 1. AUTH MODAL COMPONENT (CLEAN LOGIN & REGISTER IN ENGLISH)
    // =========================================================================
    function AuthModalContent({ initialMode, onLoginSuccess, onClose }) {
      const [isRegister, setIsRegister] = useState(initialMode === 'register');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [jlptTargetLevel, setJlptTargetLevel] = useState('N5');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);

        try {
          if (isRegister) {
            const res = await apiRequest('/auth/register', 'POST', {
              email: email.trim(),
              password: password.trim(),
              fullName: fullName.trim(),
              jlptTargetLevel,
              avatarUrl: 'https://api.dicebear.com/7.x/adventurer/svg?seed=Kenji',
              role: 'Student'
            });
            onLoginSuccess(res.data);
          } else {
            const res = await apiRequest('/auth/login', 'POST', {
              email: email.trim(),
              password: password.trim()
            });
            onLoginSuccess(res.data);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
            <h3 style={{ fontSize: '1.4rem', fontWeight: 800 }}>
              {isRegister ? 'Create JLMS Account' : 'Sign in to JLMS'}
            </h3>
            <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '1.25rem', cursor: 'pointer', color: '#94a3b8' }}>✕</button>
          </div>

          {error && (
            <div style={{ padding: '0.75rem', background: '#fff1f2', color: '#e11d48', borderRadius: '10px', fontSize: '0.88rem', marginBottom: '1.25rem', border: '1px solid #fecdd3' }}>
              ⚠️ {error}
            </div>
          )}

          <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            {isRegister && (
              <div>
                <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: 700, marginBottom: '0.25rem' }}>Full Name *</label>
                <input
                  type="text"
                  placeholder="e.g. John Doe"
                  value={fullName}
                  onChange={e => setFullName(e.target.value)}
                  className="form-input"
                  required
                />
              </div>
            )}

            <div>
              <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: 700, marginBottom: '0.25rem' }}>Email Address *</label>
              <input
                type="email"
                placeholder="name@example.com"
                value={email}
                onChange={e => setEmail(e.target.value)}
                className="form-input"
                required
              />
            </div>

            <div>
              <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: 700, marginBottom: '0.25rem' }}>Password *</label>
              <input
                type="password"
                placeholder="Minimum 6 characters"
                value={password}
                onChange={e => setPassword(e.target.value)}
                className="form-input"
                required
              />
            </div>

            {isRegister && (
              <div>
                <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: 700, marginBottom: '0.25rem' }}>Target JLPT Level</label>
                <select
                  value={jlptTargetLevel}
                  onChange={e => setJlptTargetLevel(e.target.value)}
                  className="form-select"
                >
                  <option value="N5">N5 - Beginner</option>
                  <option value="N4">N4 - Elementary</option>
                  <option value="N3">N3 - Intermediate</option>
                  <option value="N2">N2 - Advanced</option>
                  <option value="N1">N1 - Fluent</option>
                </select>
              </div>
            )}

            <button
              type="submit"
              disabled={loading}
              className="btn-primary-purple"
              style={{ width: '100%', padding: '0.85rem', marginTop: '0.5rem', fontSize: '1rem' }}
            >
              {loading ? 'Processing...' : isRegister ? 'Create Free Account' : 'Sign In'}
            </button>
          </form>

          <div style={{ textAlign: 'center', marginTop: '1.5rem', fontSize: '0.88rem', color: '#64748b' }}>
            {isRegister ? (
              <span>
                Already have an account?{' '}
                <button onClick={() => setIsRegister(false)} style={{ background: 'none', border: 'none', color: '#7C3AED', fontWeight: 800, cursor: 'pointer' }}>
                  Sign In
                </button>
              </span>
            ) : (
              <span>
                Don't have an account?{' '}
                <button onClick={() => setIsRegister(true)} style={{ background: 'none', border: 'none', color: '#7C3AED', fontWeight: 800, cursor: 'pointer' }}>
                  Sign Up Free
                </button>
              </span>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. PROFILE MODAL (VIEW & EDIT PROFILE IN ENGLISH)
    // =========================================================================
    function MyProfileModal({ currentUser, onClose, onUpdateSuccess }) {
      const [isEditing, setIsEditing] = useState(false);
      const [fullName, setFullName] = useState(currentUser?.fullName || '');
      const [email, setEmail] = useState(currentUser?.email || '');
      const [avatarUrl, setAvatarUrl] = useState(currentUser?.avatarUrl || AVATAR_PRESETS[0].url);
      const [jlptTargetLevel, setJlptTargetLevel] = useState(currentUser?.jlptTargetLevel || 'N5');
      const [newPassword, setNewPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSave = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const body = {
            email: email.trim(),
            fullName: fullName.trim(),
            avatarUrl,
            jlptTargetLevel,
            role: currentUser.role,
            status: currentUser.status
          };
          if (newPassword.trim()) body.password = newPassword.trim();
          const res = await apiRequest(`/accounts/${currentUser.accountId}`, 'PUT', body);
          onUpdateSuccess(res.data);
          onClose();
        } catch (err) {
          alert(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h4 style={{ fontSize: '1.25rem', marginBottom: '1.25rem', fontWeight: 800 }}>
              {isEditing ? 'Edit Profile & Avatar' : 'Your Account Profile'}
            </h4>

            {!isEditing ? (
              <div style={{ textAlign: 'center' }}>
                <img src={currentUser?.avatarUrl || AVATAR_PRESETS[0].url} alt="avt" style={{ width: '88px', height: '88px', borderRadius: '50%', margin: '0 auto 0.75rem', border: '3px solid var(--primary-orange-border)', background: '#fff7ed', boxShadow: '0 6px 16px rgba(249, 115, 22, 0.15)' }} />
                <h3 style={{ fontSize: '1.3rem', fontWeight: 800 }}>{currentUser?.fullName}</h3>
                <p style={{ color: 'var(--text-body)', fontSize: '0.85rem' }}>{currentUser?.email}</p>
                <div style={{ marginTop: '0.5rem' }}>
                  <span className={`role-badge role-${currentUser?.role?.toLowerCase()}`}>{currentUser?.role}</span>
                </div>

                <div style={{ background: '#fbf9f5', borderRadius: '14px', padding: '1.1rem', margin: '1.25rem 0', textAlign: 'left', border: '1px solid var(--border-color)', display: 'flex', flexDirection: 'column', gap: '0.5rem', fontSize: '0.88rem' }}>
                  <div><strong>Account ID:</strong> #{currentUser?.accountId}</div>
                  <div><strong>JLPT Target:</strong> <span style={{ color: 'var(--primary-orange)', fontWeight: 700 }}>{currentUser?.jlptTargetLevel || 'N5'}</span></div>
                  <div><strong>Status:</strong> <span className="status-badge active">{currentUser?.status}</span></div>
                  <div><strong>Created Date:</strong> {currentUser?.createdAt ? new Date(currentUser?.createdAt).toLocaleDateString('en-US') : '-'}</div>
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '1.5rem' }}>
                  <button className="btn-dash btn-dash-secondary" onClick={onClose}>Close</button>
                  <button className="btn-dash btn-dash-primary" onClick={() => setIsEditing(true)}>
                    ✏️ Edit Profile & Avatar
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSave} style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>
                <div style={{ textAlign: 'center', marginBottom: '0.5rem' }}>
                  <label style={{ fontSize: '0.82rem', fontWeight: 700, color: 'var(--text-body)' }}>Choose Profile Avatar:</label>
                  <div style={{ margin: '0.5rem auto' }}>
                    <img src={avatarUrl} alt="prev" style={{ width: '74px', height: '74px', borderRadius: '50%', border: '3px solid var(--primary-orange)', background: '#fff7ed' }} />
                  </div>
                  <div className="avatar-grid">
                    {AVATAR_PRESETS.map(p => (
                      <div key={p.id} className={`avatar-option ${avatarUrl === p.url ? 'selected' : ''}`} onClick={() => setAvatarUrl(p.url)} title={p.label}>
                        <img src={p.url} alt={p.label} />
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Full Name *</label>
                  <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="form-input" required />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Email Address *</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="form-input" required />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Target JLPT Level</label>
                  <select value={jlptTargetLevel} onChange={e => setJlptTargetLevel(e.target.value)} className="form-select">
                    <option value="N5">N5 - Beginner</option>
                    <option value="N4">N4 - Elementary</option>
                    <option value="N3">N3 - Intermediate</option>
                    <option value="N2">N2 - Advanced</option>
                    <option value="N1">N1 - Fluent</option>
                  </select>
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>New Password (Leave blank to keep unchanged)</label>
                  <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="Minimum 6 characters..." className="form-input" />
                </div>

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.5rem', marginTop: '0.75rem' }}>
                  <button type="button" className="btn-dash btn-dash-secondary" onClick={() => setIsEditing(false)}>Cancel</button>
                  <button type="submit" disabled={loading} className="btn-dash btn-dash-primary">
                    {loading ? 'Saving...' : '💾 Save Profile'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. EDIT ACCOUNT MODAL (MANAGER EDIT MODAL - ACTIVE / INACTIVE ONLY)
    // =========================================================================
    function EditAccountModal({ account, onClose, onSaveSuccess }) {
      const [fullName, setFullName] = useState(account.fullName || '');
      const [email, setEmail] = useState(account.email || '');
      const [role, setRole] = useState(account.role || 'Student');
      const [status, setStatus] = useState(account.status === 'inactive' ? 'inactive' : 'active');
      const [jlptTargetLevel, setJlptTargetLevel] = useState(account.jlptTargetLevel || 'N5');
      const [avatarUrl, setAvatarUrl] = useState(account.avatarUrl || AVATAR_PRESETS[0].url);
      const [newPassword, setNewPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);

        try {
          const body = {
            email: email.trim(),
            fullName: fullName.trim(),
            role,
            status,
            jlptTargetLevel,
            avatarUrl
          };
          if (newPassword.trim()) {
            body.password = newPassword.trim();
          }

          const res = await apiRequest(`/accounts/${account.accountId}`, 'PUT', body);
          onSaveSuccess(res.data);
          onClose();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
              <h3 style={{ fontSize: '1.3rem', fontWeight: 800, color: 'var(--text-heading)' }}>
                Edit Account #{account.accountId}
              </h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '1.25rem', cursor: 'pointer', color: '#94a3b8' }}>✕</button>
            </div>

            {error && (
              <div style={{ padding: '0.75rem', background: '#fff1f2', color: '#e11d48', borderRadius: '10px', fontSize: '0.85rem', marginBottom: '1rem', border: '1px solid #fecdd3' }}>
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>
              <div style={{ textAlign: 'center' }}>
                <label style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-body)' }}>Account Avatar:</label>
                <div style={{ margin: '0.4rem auto' }}>
                  <img src={avatarUrl} alt="prev" style={{ width: '64px', height: '64px', borderRadius: '50%', border: '3px solid var(--primary-orange)', background: '#fff7ed' }} />
                </div>
                <div className="avatar-grid">
                  {AVATAR_PRESETS.map(p => (
                    <div key={p.id} className={`avatar-option ${avatarUrl === p.url ? 'selected' : ''}`} onClick={() => setAvatarUrl(p.url)} title={p.label}>
                      <img src={p.url} alt={p.label} />
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Full Name *</label>
                <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="form-input" required />
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Email Address *</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="form-input" required />
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Role *</label>
                  <select value={role} onChange={e => setRole(e.target.value)} className="form-select">
                    <option value="Student">Student</option>
                    <option value="Lecturer">Lecturer</option>
                    <option value="Manager">Manager</option>
                    <option value="Author">Author</option>
                  </select>
                </div>

                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Status *</label>
                  <select value={status} onChange={e => setStatus(e.target.value)} className="form-select">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Target JLPT Level</label>
                <select value={jlptTargetLevel} onChange={e => setJlptTargetLevel(e.target.value)} className="form-select">
                  <option value="N5">N5 - Beginner</option>
                  <option value="N4">N4 - Elementary</option>
                  <option value="N3">N3 - Intermediate</option>
                  <option value="N2">N2 - Advanced</option>
                  <option value="N1">N1 - Fluent</option>
                </select>
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>New Password (Leave blank to keep unchanged)</label>
                <input type="password" placeholder="Enter new password (min 6 chars)..." value={newPassword} onChange={e => setNewPassword(e.target.value)} className="form-input" />
              </div>

              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.5rem', marginTop: '1rem' }}>
                <button type="button" className="btn-dash btn-dash-secondary" onClick={onClose}>Cancel</button>
                <button type="submit" disabled={loading} className="btn-dash btn-dash-primary">
                  {loading ? 'Saving...' : '💾 Save Changes'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. CREATE ACCOUNT MODAL (MANAGER CREATE NEW ACCOUNT)
    // =========================================================================
    function CreateAccountModal({ onClose, onCreateSuccess }) {
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [role, setRole] = useState('Student');
      const [jlptTargetLevel, setJlptTargetLevel] = useState('N5');
      const [avatarUrl, setAvatarUrl] = useState(AVATAR_PRESETS[0].url);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);

        try {
          const body = {
            email: email.trim(),
            password: password.trim(),
            fullName: fullName.trim(),
            role,
            jlptTargetLevel,
            avatarUrl
          };

          const res = await apiRequest('/accounts', 'POST', body);
          onCreateSuccess(res.data);
          onClose();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
              <h3 style={{ fontSize: '1.3rem', fontWeight: 800, color: 'var(--text-heading)' }}>
                Add New Account
              </h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '1.25rem', cursor: 'pointer', color: '#94a3b8' }}>✕</button>
            </div>

            {error && (
              <div style={{ padding: '0.75rem', background: '#fff1f2', color: '#e11d48', borderRadius: '10px', fontSize: '0.85rem', marginBottom: '1rem', border: '1px solid #fecdd3' }}>
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>
              <div style={{ textAlign: 'center' }}>
                <label style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-body)' }}>Select Avatar:</label>
                <div style={{ margin: '0.4rem auto' }}>
                  <img src={avatarUrl} alt="prev" style={{ width: '64px', height: '64px', borderRadius: '50%', border: '3px solid var(--primary-orange)', background: '#fff7ed' }} />
                </div>
                <div className="avatar-grid">
                  {AVATAR_PRESETS.map(p => (
                    <div key={p.id} className={`avatar-option ${avatarUrl === p.url ? 'selected' : ''}`} onClick={() => setAvatarUrl(p.url)} title={p.label}>
                      <img src={p.url} alt={p.label} />
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Full Name *</label>
                <input type="text" placeholder="e.g. Alex Johnson" value={fullName} onChange={e => setFullName(e.target.value)} className="form-input" required />
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Email Address *</label>
                <input type="email" placeholder="user@japanlearning.com" value={email} onChange={e => setEmail(e.target.value)} className="form-input" required />
              </div>

              <div>
                <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Initial Password *</label>
                <input type="password" placeholder="Minimum 6 characters" value={password} onChange={e => setPassword(e.target.value)} className="form-input" required />
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Role *</label>
                  <select value={role} onChange={e => setRole(e.target.value)} className="form-select">
                    <option value="Student">Student</option>
                    <option value="Lecturer">Lecturer</option>
                    <option value="Manager">Manager</option>
                    <option value="Author">Author</option>
                  </select>
                </div>

                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Target JLPT Level</label>
                  <select value={jlptTargetLevel} onChange={e => setJlptTargetLevel(e.target.value)} className="form-select">

                    <option value="N4">N4 - Elementary</option>
                    <option value="N3">N3 - Intermediate</option>
                    <option value="N2">N2 - Advanced</option>

              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.5rem', marginTop: '1rem' }}>
                <button type="button" className="btn-dash btn-dash-secondary" onClick={onClose}>Cancel</button>

                  {loading ? 'Creating...' : '+ Create Account'}

              </div>
            </form>
          </div>
        </div>
      );

    // =========================================================================
    // 5. ACCOUNT MANAGEMENT VIEW (MANAGER ONLY - ENGLISH & NO DELETE)
    // =========================================================================
    function AccountManagementView({ currentUser, onAccountUpdated }) {
      const [accounts, setAccounts] = useState([]);
      const [pageInfo, setPageInfo] = useState({ page: 0, size: 8, totalPages: 1, totalElements: 0 });
      const [keyword, setKeyword] = useState('');
      const [roleFilter, setRoleFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('');
      const [page, setPage] = useState(0);

      const [editingAccount, setEditingAccount] = useState(null);
      const [showCreateModal, setShowCreateModal] = useState(false);

      const fetchAccounts = useCallback(async () => {
        try {
          const params = new URLSearchParams();
          if (keyword.trim()) params.append('keyword', keyword.trim());
          if (roleFilter) params.append('role', roleFilter);
          if (statusFilter) params.append('status', statusFilter);
          params.append('page', page);
          params.append('size', 8);
          params.append('sort', 'createdAt,desc');
          const res = await apiRequest(`/accounts?${params.toString()}`);
          setAccounts(res.data.content);
          setPageInfo({ page: res.data.page, size: res.data.size, totalPages: res.data.totalPages, totalElements: res.data.totalElements });
        } catch (e) {}
      }, [keyword, roleFilter, statusFilter, page]);

      useEffect(() => { fetchAccounts(); }, [fetchAccounts]);

      const handleToggleStatus = async (acc) => {
        const newStatus = acc.status === 'active' ? 'inactive' : 'active';
        await apiRequest(`/accounts/${acc.accountId}/status`, 'PATCH', { status: newStatus });
        fetchAccounts();
      };

      return (
        <div className="content-card">
          <div className="card-header-row">

              <h3 style={{ fontSize: '1.35rem', fontWeight: 800 }}>All Accounts Management</h3>
              <div style={{ color: '#10b981', fontWeight: 600, fontSize: '0.85rem' }}>
                Total: {pageInfo.totalElements} accounts ({accounts.filter(a => a.status === 'active').length} active on this page)
              </div>
            </div>

            <div className="card-actions-group">
              <input type="text" placeholder="Search name or email..." value={keyword} onChange={e => { setKeyword(e.target.value); setPage(0); }} className="search-pill-input" />
              <select value={roleFilter} onChange={e => { setRoleFilter(e.target.value); setPage(0); }} className="select-pill">

                <option value="Student">Student</option>
                <option value="Lecturer">Lecturer</option>
                <option value="Manager">Manager</option>
                <option value="Author">Author</option>
              </select>
              <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setPage(0); }} className="select-pill">
                <option value="">Status: All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
              <button className="btn-dash btn-dash-primary" onClick={() => setShowCreateModal(true)}>
                + Add Account
              </button>
            </div>
          </div>

          <div style={{ overflowX: 'auto' }}>
            <table className="clean-table">
              <thead>
                <tr style={{ color: '#94a3b8', fontSize: '0.8rem', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                  <th>Account</th>
                  <th>Role</th>
                  <th>JLPT Target</th>
                  <th>Email</th>
                  <th>Created Date</th>
                  <th style={{ textAlign: 'center' }}>Status</th>
                  <th style={{ textAlign: 'center' }}>Action</th>
                </tr>
              </thead>
              <tbody>
                {accounts.length === 0 ? (
                  <tr>
                    <td colSpan="7" style={{ textAlign: 'center', padding: '3rem', color: '#94a3b8' }}>
                      No accounts found matching your filter criteria.
                    </td>
                  </tr>
                ) : (
                  accounts.map(acc => (
                    <tr key={acc.accountId}>
                      <td>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                          <img src={acc.avatarUrl || AVATAR_PRESETS[0].url} alt="avt" style={{ width: '38px', height: '38px', borderRadius: '50%', background: '#fff7ed', border: '1px solid #fed7aa' }} />
                          <div>
                            <strong style={{ color: 'var(--text-heading)' }}>{acc.fullName}</strong>
                            <div style={{ fontSize: '0.72rem', color: '#94a3b8' }}>ID: #{acc.accountId}</div>
                          </div>
                        </div>
                      </td>
                      <td><span className={`role-badge role-${acc.role?.toLowerCase()}`}>{acc.role}</span></td>
                      <td style={{ color: 'var(--primary-orange)', fontWeight: 700 }}>{acc.jlptTargetLevel || '-'}</td>
                      <td style={{ color: 'var(--text-body)' }}>{acc.email}</td>
                      <td style={{ color: 'var(--text-muted)' }}>{acc.createdAt ? new Date(acc.createdAt).toLocaleDateString('en-US') : '-'}</td>
                      <td style={{ textAlign: 'center' }}>
                        <button onClick={() => handleToggleStatus(acc)} className={`status-badge ${acc.status}`} title="Click to toggle Status (Active / Inactive)">

                      <td style={{ textAlign: 'center', whiteSpace: 'nowrap' }}>

          {/* Pagination */}
          <div className="pagination-bar">

            <div style={{ display: 'flex', gap: '0.4rem' }}>
              <button
                className="page-btn"
                disabled={page <= 0}
                onClick={() => setPage(p => Math.max(0, p - 1))}

          {editingAccount && (
            <EditAccountModal

              onCreateSuccess={() => {
                alert('New account created successfully!');
                fetchAccounts();
              }}
            />
          )}
        </div>
      );

    // =========================================================================
    // 7. MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [token, setToken] = useState(localStorage.getItem('jwt_token') || null);
      const [currentUser, setCurrentUser] = useState(
        localStorage.getItem('user_info') ? JSON.parse(localStorage.getItem('user_info')) : null
      );
      
      const [viewMode, setViewMode] = useState(() => {
        const user = localStorage.getItem('user_info') ? JSON.parse(localStorage.getItem('user_info')) : null;
        if (user?.role === 'Manager') return 'dashboard';
        if (user?.role === 'Lecturer') return 'materials';
        if (user?.role === 'Author') return 'culture_articles';
        return 'landing';
      });

      const [activeDashTab, setActiveDashTab] = useState('accounts');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [showMyProfileModal, setShowMyProfileModal] = useState(false);
      const [showProPopup, setShowProPopup] = useState(false);

      useEffect(() => {
        if (token && !currentUser) {
          apiRequest('/auth/me', 'GET')
            .then(res => {
              setCurrentUser(res.data);
              localStorage.setItem('user_info', JSON.stringify(res.data));
              if (res.data.role === 'Manager') setViewMode('dashboard');
              else if (res.data.role === 'Lecturer') setViewMode('materials');
              else if (res.data.role === 'Author') setViewMode('culture_articles');
              else setViewMode('landing');
            })
            .catch(() => {
              setToken(null);
              localStorage.removeItem('jwt_token');
              localStorage.removeItem('user_info');
              setViewMode('landing');
            });
        }
      }, [token]);

      const handleLoginSuccess = (authData) => {
        setToken(authData.accessToken);
        setCurrentUser(authData.account);
        localStorage.setItem('jwt_token', authData.accessToken);
        localStorage.setItem('user_info', JSON.stringify(authData.account));
        setShowAuthModal(false);

        if (authData.account.role === 'Manager') {
          setViewMode('dashboard');
          setActiveDashTab('accounts');
        } else if (authData.account.role === 'Lecturer') {
          setViewMode('materials');
        } else if (authData.account.role === 'Author') {
          setViewMode('culture_articles');
        } else {
          setViewMode('landing');
        }
      };

      const handleLogout = () => {
        setToken(null);
        setCurrentUser(null);
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        setViewMode('landing');
      };

      const handleProfileUpdated = (updatedData) => {
        const updatedAcc = updatedData.account ? updatedData.account : updatedData;

                      <div style={{ fontSize: '0.72rem', color: '#64748b', background: '#fff1f2', padding: '4px 8px', borderRadius: '8px', textAlign: 'center' }}>

                    </div>

                    <div className="iso-card iso-card-listening">
                      <div className="card-badge" style={{ background: '#fff7ed', color: '#c2410c' }}>🎧 JLPT N1 Chōkai</div>

                        </div>
                        <div style={{ width: '48px', height: '48px', borderRadius: '50%', border: '4px solid #10b981', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '0.85rem', color: '#059669', background: '#ecfdf5' }}>
                          A+
                        </div>
                      </div>
                    </div>

                    <div className="iso-card iso-card-flashcard">
                      <div className="card-badge" style={{ background: '#fef3c7', color: '#b45309' }}>🌸 SRS Flashcard</div>

                      <div style={{ fontSize: '0.75rem', color: '#475569', marginTop: '2px' }}>Cherry Blossom</div>
                      <div style={{ marginTop: '0.5rem', height: '4px', background: '#e2e8f0', borderRadius: '2px', overflow: 'hidden' }}>

                <div className="sidebar-menu">
                  <div className={`nav-item ${activeDashTab === 'accounts' ? 'active' : ''}`} onClick={() => setActiveDashTab('accounts')}>

                    <span>›</span>
                  </div>

                    <img src={currentUser?.avatarUrl || AVATAR_PRESETS[0].url} alt="avt" className="sidebar-avatar" />
                    <div style={{ overflow: 'hidden' }}>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{currentUser?.fullName}</div>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{currentUser?.email}</div>
                    </div>
                  </div>
                  <span style={{ color: 'var(--primary-orange)', fontWeight: 700 }}>✏️</span>

                      currentUser={currentUser}
                      onViewProfile={() => setShowMyProfileModal(true)}
                      onNavigate={(mode) => setViewMode(mode)}
                      onLogout={handleLogout}
                    />
                  </div>
                </div>

                  <AccountManagementView currentUser={currentUser} onAccountUpdated={handleProfileUpdated} />

                    <p style={{ color: 'var(--text-muted)', marginTop: '0.5rem', fontSize: '0.95rem' }}>

                    </p>

                {activeDashTab === 'payment_report' && (
                  <div className="content-card" style={{ textAlign: 'center', padding: '4.5rem 2rem' }}>
                    <div style={{ fontSize: '3.5rem', marginBottom: '0.75rem' }}>💳</div>
                    <h3 style={{ fontSize: '1.35rem', fontWeight: 800 }}>Payment Report</h3>
                    <p style={{ color: 'var(--text-muted)', marginTop: '0.5rem', fontSize: '0.95rem' }}>
                      Currently no payment transaction records available.
                    </p>
                  </div>
                )}

                {activeDashTab === 'refund_info' && (
                  <div className="content-card" style={{ textAlign: 'center', padding: '4.5rem 2rem' }}>
                    <div style={{ fontSize: '3.5rem', marginBottom: '0.75rem' }}>🔄</div>
                    <h3 style={{ fontSize: '1.35rem', fontWeight: 800 }}>Refund Information</h3>
                    <p style={{ color: 'var(--text-muted)', marginTop: '0.5rem', fontSize: '0.95rem' }}>
                      Currently no refund requests available.
                    </p>
                  </div>
                )}
              </main>

          {viewMode === 'materials' && (
            <div style={{ minHeight: '100vh', background: 'var(--bg-body)' }}>

                      currentUser={currentUser}

                      onNavigate={(mode) => setViewMode(mode)}

                    />
                  </div>
                </div>
              </nav>

              <main style={{ maxWidth: '1100px', margin: '3rem auto', padding: '0 1.5rem' }}>

                  <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>📚</div>
                  <h2 style={{ fontSize: '1.75rem', fontWeight: 800, color: 'var(--text-heading)' }}>Learning Materials</h2>

                      onNavigate={(mode) => setViewMode(mode)}
                      onLogout={handleLogout}
                    />
                  </div>
                </div>
              </nav>

              <main style={{ maxWidth: '1100px', margin: '3rem auto', padding: '0 1.5rem' }}>
                <div className="content-card" style={{ textAlign: 'center', padding: '5rem 2rem' }}>
                  <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>🌸</div>
                  <h2 style={{ fontSize: '1.75rem', fontWeight: 800, color: 'var(--text-heading)' }}>Cultural Articles Management</h2>
                  <p style={{ color: 'var(--text-muted)', fontSize: '1.05rem', marginTop: '0.65rem' }}>
                    Currently no cultural articles found in the system.

                  <div style={{ marginTop: '2rem' }}>

                </div>
              </main>
            </div>
          )}

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="modal-overlay" onClick={() => setShowAuthModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <AuthModalContent
                  initialMode={authMode}
                  onLoginSuccess={handleLoginSuccess}
                  onClose={() => setShowAuthModal(false)}
                />
              </div>
            </div>
          )}

          {/* Pro Popup */}
          {showProPopup && (
            <div className="modal-overlay" onClick={() => setShowProPopup(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()} style={{ textAlign: 'center' }}>
                <div style={{ fontSize: '3rem', marginBottom: '0.5rem' }}>🚀</div>
                <h3 style={{ color: 'var(--primary-orange)', marginBottom: '0.5rem', fontWeight: 800 }}>JLMS Pro — Coming Soon!</h3>
                <p style={{ color: 'var(--text-body)', fontSize: '0.9rem' }}>Advanced features and AI models are being integrated.</p>
                <button className="btn-dash btn-dash-primary" style={{ marginTop: '1.25rem' }} onClick={() => setShowProPopup(false)}>Got It</button>
              </div>
            </div>
          )}

          {/* View Profile & CRUD Modal (Current user) */}
          {showMyProfileModal && (
            <MyProfileModal currentUser={currentUser} onClose={() => setShowMyProfileModal(false)} onUpdateSuccess={handleProfileUpdated} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
