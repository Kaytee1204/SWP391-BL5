<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Japanese Learning Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-active: #c2410c;
      --primary-light: #fff7ed;
      --primary-soft: #ffedd5;
      --primary-border: #fed7aa;
      --accent-purple: #7c3aed;
      --accent-purple-light: #f5f3ff;
      --accent-purple-border: #ddd6fe;
      --bg-body: #fbf9f5;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --text-main: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #a8a29e;
      --border-color: #f2ede4;
      --border-hover: #e7e0d4;
      --status-active-bg: #ecfdf5;
      --status-active-text: #059669;
      --status-active-border: #a7f3d0;
      --status-inactive-bg: #fff1f2;
      --status-inactive-text: #e11d48;
      --status-inactive-border: #fecdd3;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --radius-full: 9999px;
      --shadow-subtle: 0 4px 20px -2px rgba(120, 80, 40, 0.04);
      --shadow-card: 0 10px 30px -4px rgba(120, 80, 40, 0.06);
      --shadow-pop: 0 20px 40px -10px rgba(249, 115, 22, 0.15);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
    }

    .dashboard-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 270px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand-box { display: flex; align-items: center; gap: 0.75rem; padding-left: 0.5rem; margin-bottom: 2.25rem; }
    .brand-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
    }
    .brand-name { font-weight: 800; font-size: 1.25rem; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1rem; border-radius: var(--radius-md);
      font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);
      cursor: pointer; transition: var(--transition);
    }
    .nav-item:hover { background-color: var(--primary-light); color: var(--primary); }
    .nav-item.active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white; box-shadow: 0 6px 16px rgba(249, 115, 22, 0.28);
    }
    .nav-item-left { display: flex; align-items: center; gap: 0.85rem; }
    .sidebar-promo-card {
      background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%);
      border-radius: var(--radius-lg); padding: 1.15rem; margin-bottom: 1.25rem;
      border: 1px solid #fdba74; text-align: center;
    }
    .sidebar-user-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.75rem; background: var(--bg-body);
      border-radius: var(--radius-md); border: 1px solid var(--border-color);
      cursor: pointer; transition: var(--transition);
    }
    .sidebar-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid white; }
    .main-viewport { flex: 1; padding: 2.25rem 2.5rem; overflow-y: auto; max-width: 1360px; }
    .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .greeting-title { font-size: 1.5rem; font-weight: 800; }
    .content-card {
      background: var(--bg-card); border-radius: var(--radius-xl);
      padding: 2rem; box-shadow: var(--shadow-card); border: 1px solid var(--border-color);
    }
    .card-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1.25rem; }
    .card-actions-group { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .search-pill-input, .select-pill {
      padding: 0.55rem 1rem; border-radius: var(--radius-full);
      border: 1px solid var(--border-color); background: #fbf9f5; font-size: 0.85rem;
    }
    .btn {
      padding: 0.6rem 1.25rem; border-radius: var(--radius-full);
      font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer; transition: var(--transition);
    }
    .btn-primary { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; }
    .btn-secondary { background: white; border: 1px solid var(--border-color); }
    .clean-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    .clean-table th, .clean-table td { padding: 1.15rem 1.25rem; border-bottom: 1px solid var(--border-color); }
    .status-badge { padding: 0.35rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 700; }
    .status-badge.active { background-color: rgba(16, 185, 129, 0.12); color: #059669; }
    .status-badge.inactive { background-color: rgba(239, 68, 68, 0.1); color: #dc2626; }
    .role-badge { padding: 0.25rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; background: #ffedd5; color: #c2410c; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-card { background: white; border-radius: var(--radius-xl); max-width: 500px; width: 100%; padding: 1.75rem; max-height: 90vh; overflow-y: auto; }
    .form-input, .form-select { width: 100%; padding: 0.65rem 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-top: 0.3rem; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-top: 0.5rem; }
    .avatar-option { width: 50px; height: 50px; border-radius: 50%; padding: 2px; border: 2px solid transparent; cursor: pointer; text-align: center; }
    .avatar-option img { width: 100%; height: 100%; border-radius: 50%; }
    .avatar-option.selected { border-color: var(--primary); transform: scale(1.08); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const API_BASE = 'http://localhost:8080/api/v1';

    const AVATAR_PRESETS = [
      { id: 'sensei', label: 'Sensei', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Sensei' },
      { id: 'kenji', label: 'Kenji', url: 'https://api.dicebear.com/7.x/adventurer/svg?seed=Kenji' },
      { id: 'sakura', label: 'Sakura', url: 'https://api.dicebear.com/7.x/adventurer/svg?seed=Sakura' },
      { id: 'samurai', label: 'Samurai', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Samurai' },
      { id: 'ninja', label: 'Ninja', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Ninja' },
      { id: 'taro', label: 'Taro', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Taro' },
      { id: 'yuki', label: 'Yuki', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Yuki' },
      { id: 'manager', label: 'Manager', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=Manager' }
    ];

    async function apiRequest(endpoint, method = 'GET', body = null, token = null) {
      const headers = { 'Content-Type': 'application/json' };
      const authToken = token || localStorage.getItem('jwt_token');
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      const config = { method, headers };
      if (body) config.body = JSON.stringify(body);
      const res = await fetch(`${API_BASE}${endpoint}`, config);
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        throw new Error(data?.message || `Lỗi (${res.status})`);
      }
      return data;
    }

    function DashboardApp() {
      const [token, setToken] = useState(localStorage.getItem('jwt_token') || null);
      const [currentUser, setCurrentUser] = useState(
        localStorage.getItem('user_info') ? JSON.parse(localStorage.getItem('user_info')) : null
      );
      const [activeTab, setActiveTab] = useState('accounts');
      const [showMyProfileModal, setShowMyProfileModal] = useState(false);
      const [showProPopup, setShowProPopup] = useState(false);

      if (!token) {
        window.location.href = './index.html';
        return null;
      }

      const handleProfileUpdated = (updatedData) => {
        const updatedAcc = updatedData.account ? updatedData.account : updatedData;
        setCurrentUser(updatedAcc);
        localStorage.setItem('user_info', JSON.stringify(updatedAcc));
        alert('Cập nhật thông tin và avatar thành công!');
      };

      const handleLogout = () => {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = './index.html';
      };

      return (
        <div className="dashboard-layout">
          <aside className="sidebar">
            <div className="brand-box">
              <div className="brand-logo">JP</div>
              <div className="brand-name">Dashboard</div>
            </div>

            <div className="sidebar-menu">
              <div className={`nav-item ${activeTab === 'accounts' ? 'active' : ''}`} onClick={() => setActiveTab('accounts')}>
                <div className="nav-item-left"><span>👥</span><span>Accounts</span></div>
                <span>›</span>
              </div>
              <div className={`nav-item ${activeTab === 'payment_report' ? 'active' : ''}`} onClick={() => setActiveTab('payment_report')}>
                <div className="nav-item-left"><span>💳</span><span>Payment Report</span></div>
                <span>›</span>
              </div>
              <div className={`nav-item ${activeTab === 'refund_info' ? 'active' : ''}`} onClick={() => setActiveTab('refund_info')}>
                <div className="nav-item-left"><span>🔄</span><span>Refund Information</span></div>
                <span>›</span>
              </div>
            </div>

            <div className="sidebar-promo-card">
              <div style={{ fontSize: '0.82rem', fontWeight: 800, color: '#9a3412', marginBottom: '0.35rem' }}>✨ Japanese Pro</div>
              <div style={{ fontSize: '0.72rem', color: '#7c2d12', marginBottom: '0.75rem' }}>Tính năng AI & học tập cao cấp</div>
              <button className="btn btn-primary" style={{ width: '100%', padding: '0.45rem' }} onClick={() => setShowProPopup(true)}>
                Get Pro Now!
              </button>
            </div>

            <div className="sidebar-user-card" onClick={() => setShowMyProfileModal(true)}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', overflow: 'hidden' }}>
                <img src={currentUser?.avatarUrl || AVATAR_PRESETS[0].url} alt="avt" className="sidebar-avatar" />
                <div style={{ overflow: 'hidden' }}>
                  <div style={{ fontWeight: 700, fontSize: '0.85rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{currentUser?.fullName}</div>
                  <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{currentUser?.email}</div>
                </div>
              </div>
              <span style={{ color: 'var(--primary)', fontWeight: 700 }}>✏️</span>
            </div>
          </aside>

          <main className="main-viewport">
            <div className="top-header">
              <div>
                <h2 className="greeting-title">Hello, {currentUser?.fullName} 👋</h2>
                <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem' }}>Hệ thống Quản lý Học tiếng Nhật & Tài khoản chuyên sâu</p>
              </div>
              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <button className="btn btn-secondary" onClick={() => window.location.href = './index.html'}>
                  🏠 Về Landing Page
                </button>
                <button className="btn btn-secondary" onClick={handleLogout}>
                  🚪 Đăng xuất
                </button>
              </div>
            </div>

            {activeTab === 'accounts' && (
              <AccountManagementView currentUser={currentUser} onAccountUpdated={handleProfileUpdated} />
            )}

            {activeTab === 'payment_report' && (
              <div className="content-card" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
                <div style={{ fontSize: '3rem', marginBottom: '0.75rem' }}>💳</div>
                <h3>Payment Report</h3>
                <p style={{ color: 'var(--text-muted)', marginTop: '0.5rem' }}>Hiện tại chưa có dữ liệu giao dịch thanh toán nào.</p>
              </div>
            )}

            {activeTab === 'refund_info' && (
              <div className="content-card" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
                <div style={{ fontSize: '3rem', marginBottom: '0.75rem' }}>🔄</div>
                <h3>Refund Information</h3>
                <p style={{ color: 'var(--text-muted)', marginTop: '0.5rem' }}>Hiện tại chưa có yêu cầu hoàn tiền nào.</p>
              </div>
            )}
          </main>

          {showProPopup && (
            <div className="modal-overlay" onClick={() => setShowProPopup(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()} style={{ textAlign: 'center' }}>
                <div style={{ fontSize: '3rem', marginBottom: '0.5rem' }}>🚀</div>
                <h3 style={{ color: 'var(--primary)', marginBottom: '0.5rem' }}>Japanese Pro - Sắp ra mắt!</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Tính năng đang được hoàn thiện.</p>
                <button className="btn btn-primary" style={{ marginTop: '1.25rem' }} onClick={() => setShowProPopup(false)}>Đã hiểu</button>
              </div>
            </div>
          )}

          {showMyProfileModal && (
            <MyProfileModal currentUser={currentUser} onClose={() => setShowMyProfileModal(false)} onUpdateSuccess={handleProfileUpdated} />
          )}
        </div>
      );
    }

    function AccountManagementView({ currentUser, onAccountUpdated }) {
      const [accounts, setAccounts] = useState([]);
      const [pageInfo, setPageInfo] = useState({ page: 0, size: 8, totalPages: 0, totalElements: 0 });
      const [keyword, setKeyword] = useState('');
      const [roleFilter, setRoleFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('');
      const [page, setPage] = useState(0);

      const fetchAccounts = useCallback(async () => {
        try {
          const params = new URLSearchParams();
          if (keyword.trim()) params.append('keyword', keyword.trim());
          if (roleFilter) params.append('role', roleFilter);
          if (statusFilter) params.append('status', statusFilter);
          params.append('page', page);
          params.append('size', 8);
          params.append('sort', 'createdAt,desc');
          const res = await apiRequest(`/accounts?${params.toString()}`);
          setAccounts(res.data.content);
          setPageInfo({ page: res.data.page, size: res.data.size, totalPages: res.data.totalPages, totalElements: res.data.totalElements });
        } catch (e) {}
      }, [keyword, roleFilter, statusFilter, page]);

      useEffect(() => { fetchAccounts(); }, [fetchAccounts]);

      const handleToggleStatus = async (acc) => {
        const newStatus = acc.status === 'active' ? 'inactive' : 'active';
        await apiRequest(`/accounts/${acc.accountId}/status`, 'PATCH', { status: newStatus });
        fetchAccounts();
      };

      return (
        <div className="content-card">
          <div className="card-header-row">
            <div>
              <h3>All Accounts</h3>
              <div style={{ color: '#10b981', fontWeight: 600, fontSize: '0.85rem' }}>Active Members ({accounts.filter(a => a.status === 'active').length} on this page)</div>
            </div>

            <div className="card-actions-group">
              <input type="text" placeholder="Search name/email..." value={keyword} onChange={e => { setKeyword(e.target.value); setPage(0); }} className="search-pill-input" />
              <select value={roleFilter} onChange={e => { setRoleFilter(e.target.value); setPage(0); }} className="select-pill">
                <option value="">Role: All</option>
                <option value="Student">Student</option>
                <option value="Lecturer">Lecturer</option>
                <option value="Manager">Manager</option>
              </select>
              <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setPage(0); }} className="select-pill">
                <option value="">Status: All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>

          <table className="clean-table">
            <thead>
              <tr style={{ color: '#b5b5be', fontSize: '0.8rem' }}>
                <th>Account Name</th>
                <th>Role</th>
                <th>JLPT Target</th>
                <th>Email</th>
                <th>Created Date</th>
                <th style={{ textAlign: 'center' }}>Status</th>
              </tr>
            </thead>
            <tbody>
              {accounts.map(acc => (
                <tr key={acc.accountId}>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                      <img src={acc.avatarUrl || AVATAR_PRESETS[0].url} alt="avt" style={{ width: '36px', height: '36px', borderRadius: '50%', background: '#fff7ed' }} />
                      <strong>{acc.fullName}</strong>
                    </div>
                  </td>
                  <td><span className="role-badge">{acc.role}</span></td>
                  <td style={{ color: 'var(--primary)', fontWeight: 700 }}>{acc.jlptTargetLevel || '-'}</td>
                  <td>{acc.email}</td>
                  <td style={{ color: 'var(--text-muted)' }}>{acc.createdAt ? new Date(acc.createdAt).toLocaleDateString('vi-VN') : '-'}</td>
                  <td style={{ textAlign: 'center' }}>
                    <button onClick={() => handleToggleStatus(acc)} className={`status-badge ${acc.status}`} style={{ cursor: 'pointer', border: 'none' }}>
                      {acc.status}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function MyProfileModal({ currentUser, onClose, onUpdateSuccess }) {
      const [isEditing, setIsEditing] = useState(false);
      const [fullName, setFullName] = useState(currentUser?.fullName || '');
      const [email, setEmail] = useState(currentUser?.email || '');
      const [avatarUrl, setAvatarUrl] = useState(currentUser?.avatarUrl || AVATAR_PRESETS[0].url);
      const [jlptTargetLevel, setJlptTargetLevel] = useState(currentUser?.jlptTargetLevel || 'N5');
      const [newPassword, setNewPassword] = useState('');

      const handleSave = async (e) => {
        e.preventDefault();
        try {
          const body = { email: email.trim(), fullName: fullName.trim(), avatarUrl, jlptTargetLevel, role: currentUser.role, status: currentUser.status };
          if (newPassword.trim()) body.password = newPassword.trim();
          const res = await apiRequest(`/accounts/${currentUser.accountId}`, 'PUT', body);
          onUpdateSuccess(res.data);
          onClose();
        } catch (err) {
          alert(err.message);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h4 style={{ fontSize: '1.25rem', marginBottom: '1.25rem' }}>{isEditing ? 'Chỉnh sửa tài khoản & Avatar' : 'Hồ sơ tài khoản'}</h4>
            {!isEditing ? (
              <div style={{ textAlign: 'center' }}>
                <img src={currentUser?.avatarUrl || AVATAR_PRESETS[0].url} alt="avt" style={{ width: '84px', height: '84px', borderRadius: '50%', margin: '0 auto 0.75rem', border: '3px solid var(--primary-border)' }} />
                <h3>{currentUser?.fullName}</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem' }}>{currentUser?.email}</p>
                <div style={{ marginTop: '1.5rem', display: 'flex', justifyContent: 'space-between' }}>
                  <button className="btn btn-secondary" onClick={onClose}>Đóng</button>
                  <button className="btn btn-primary" onClick={() => setIsEditing(true)}>✏️ Chỉnh sửa thông tin & Avatar</button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSave} style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>
                <div style={{ textAlign: 'center' }}>
                  <img src={avatarUrl} alt="prev" style={{ width: '70px', height: '70px', borderRadius: '50%', border: '3px solid var(--primary)' }} />
                  <div className="avatar-grid">
                    {AVATAR_PRESETS.map(p => (
                      <div key={p.id} className={`avatar-option ${avatarUrl === p.url ? 'selected' : ''}`} onClick={() => setAvatarUrl(p.url)}>
                        <img src={p.url} alt={p.label} />
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Họ và tên</label>
                  <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="form-input" />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="form-input" />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Mục tiêu JLPT</label>
                  <select value={jlptTargetLevel} onChange={e => setJlptTargetLevel(e.target.value)} className="form-select">
                    <option value="N5">N5</option><option value="N4">N4</option><option value="N3">N3</option><option value="N2">N2</option><option value="N1">N1</option>
                  </select>
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', fontWeight: 700 }}>Mật khẩu mới (Để trống nếu giữ nguyên)</label>
                  <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="Nhập từ 6 ký tự..." className="form-input" />
                </div>

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.5rem', marginTop: '0.75rem' }}>
                  <button type="button" className="btn btn-secondary" onClick={() => setIsEditing(false)}>Hủy</button>
                  <button type="submit" className="btn btn-primary">💾 Lưu hồ sơ</button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
